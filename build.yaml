# GitHub Actions build matrix for Corne Choc Pro BT left and right firmware.
---
include:
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_bt_left
  - board: corne_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_right
